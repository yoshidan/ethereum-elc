[package]
name = "ethereum-elc"
version = "0.1.0"
edition = "2021"

[dependencies]
prost = "0.11.9"
serde = { version = "1.0.186", features = ["derive"] }
bytes = "1.4.0"
time = "0.3.17"
thiserror = "2.0"
ethereum-elc-proto = { path = "../proto", default-features = false}

# ethereum-light-client-rs
ethereum-consensus = { git = "https://github.com/yoshidan/ethereum-light-client-rs", rev = "09c47ab55096a1a70f7800515ebdbba7115034ce", default-features = false }
ethereum-light-client-verifier = { git = "https://github.com/yoshidan/ethereum-light-client-rs", rev = "09c47ab55096a1a70f7800515ebdbba7115034ce", default-features = false }

# ethereum-light-client-types
ethereum-light-client-proto = { git = "https://github.com/datachainlab/ethereum-light-client-types",  rev = "relayer/v0.1.7", default-features = false }
ethereum-light-client-types = { git = "https://github.com/datachainlab/ethereum-light-client-types", rev="relayer/v0.1.7", default-features = false }

# LCP
light-client = { git = "https://github.com/datachainlab/lcp", rev = "v0.2.17", default-features = false, features = ["ibc"] }

[dev-dependencies]
light-client = { git = "https://github.com/datachainlab/lcp", rev = "v0.2.17", default-features = false, features = ["ibc", "std"] }
store = { git = "https://github.com/datachainlab/lcp", rev = "v0.2.17", default-features = false }

hex-literal = "0.4.1"
ethereum-consensus = { git = "https://github.com/yoshidan/ethereum-light-client-rs", rev = "09c47ab55096a1a70f7800515ebdbba7115034ce", default-features = false, features = ["prover"] }
ethereum-light-client-verifier = { git = "https://github.com/yoshidan/ethereum-light-client-rs", rev = "09c47ab55096a1a70f7800515ebdbba7115034ce", default-features = false, features = ["test-utils"] }
