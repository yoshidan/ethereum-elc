[package]
name = "ethereum-elc"
version = "0.1.0"
edition = "2021"

[dependencies]
prost = "0.11.9"
serde = { version = "1.0.186", features = ["derive"] }
bytes = "1.4.0"
time = "0.3.17"
thiserror = "2.0"
ethereum-elc-proto = { path = "../proto", default-features = false}

# ethereum-light-client-rs
ethereum-consensus = { git = "https://github.com/yoshidan/ethereum-light-client-rs", rev = "cb4f62bb86a143556068c0be89bf62ac5f54c75a", default-features = false }
ethereum-light-client-verifier = { git = "https://github.com/yoshidan/ethereum-light-client-rs", rev = "cb4f62bb86a143556068c0be89bf62ac5f54c75a", default-features = false }

# ethereum-light-client-types
ethereum-light-client-proto = { git = "https://github.com/datachainlab/ethereum-light-client-types", rev = "933be5eb28f9608d287b2f78cf3728883c5f7e56", default-features = false }
ethereum-light-client-types = { git = "https://github.com/datachainlab/ethereum-light-client-types", rev = "933be5eb28f9608d287b2f78cf3728883c5f7e56", default-features = false }

# LCP
light-client = { git = "https://github.com/datachainlab/lcp", rev = "v0.2.17", default-features = false, features = ["ibc"] }

[dev-dependencies]
light-client = { git = "https://github.com/datachainlab/lcp", rev = "v0.2.17", default-features = false, features = ["ibc", "std"] }
store = { git = "https://github.com/datachainlab/lcp", rev = "v0.2.17", default-features = false }

hex-literal = "0.4.1"
ethereum-consensus = { git = "https://github.com/yoshidan/ethereum-light-client-rs", rev = "cb4f62bb86a143556068c0be89bf62ac5f54c75a", default-features = false, features = ["prover"] }
ethereum-light-client-verifier = { git = "https://github.com/yoshidan/ethereum-light-client-rs", rev = "cb4f62bb86a143556068c0be89bf62ac5f54c75a", default-features = false, features = ["test-utils"] }
